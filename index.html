<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton-Raphson Solver</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
</head>
<body>
<header class="header-home">
    <h1>Solution of Nonlinear Equation<br>Newton-Raphson Method</h1>

    <div class="container">
        <div class="row">
            <!-- Inputs -->
            <div class="col-lg-5 col-sm-12">
                <h4>Instructions</h4>
                <p class="hint">
                    Use <code>x</code> as the variable. Powers: <code>x^3</code>.
                    Functions: <code>sin(x)</code>, <code>cos(x)</code>, <code>exp(x)</code>, <code>log(x)</code>, <code>sqrt(x)</code>.<br>
                    Example: <code>x^3 - x - 1</code> &nbsp;or&nbsp; <code>exp(-x) - x</code>
                </p>
                <form id="solver-form" autocomplete="off">
                    <label for="EqStr">f(x) =</label>
                    <input type="text" id="EqStr" placeholder="e.g. x^3 - x - 1" class="form-control mb-2">
                    <label for="initial-guess">Initial guess x<sub>0</sub></label>
                    <input type="text" id="initial-guess" placeholder="e.g. 1" class="form-control mb-2">
                    <label for="tolerance">Tolerance</label>
                    <input type="text" id="tolerance" value="1e-8" class="form-control mb-3">
                    <button type="submit" class="btn btn-primary btn-block">Calculate</button>
                </form>
                <button type="button" id="check-btn" class="btn btn-warning btn-block mt-2">Check the initial guess</button>
                <div id="Convergence-result" class="mt-2"></div>
                <div id="message" class="mt-2"></div>
            </div>

            <!-- Results -->
            <div class="col-lg-7 col-sm-12">
                <div id="summary" class="summary" style="display:none"></div>
                <div class="table-wrap">
                    <table class="table table-striped table-bordered table-sm mt-2">
                        <thead>
                            <tr><th>i</th><th>x<sub>i</sub></th><th>f(x<sub>i</sub>)</th><th>|x<sub>i</sub> − x<sub>i-1</sub>|</th></tr>
                        </thead>
                        <tbody id="steps-table"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Graph -->
        <div class="row mt-3">
            <div class="col-12">
                <h4>Graph</h4>
                <div class="canvas-wrap"><canvas id="plot"></canvas></div>
                <div class="legend">
                    <span><i class="dot curve"></i> f(x)</span>
                    <span><i class="dot pt"></i> iteration points (x<sub>i</sub>, f(x<sub>i</sub>))</span>
                    <span><i class="dot tan"></i> tangent lines</span>
                    <span><i class="dot root"></i> root</span>
                </div>
            </div>
        </div>
    </div>
</header>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.js"></script>
<script src="main.js"></script>
</body>
</html>
